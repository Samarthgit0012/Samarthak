services:
  - type: web
    name: govlens-india
    runtime: node
    plan: free
    region: singapore
    buildCommand: (command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@10) && pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/govlens run build && pnpm --filter @workspace/api-server run build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: AUTO_SETUP_DB
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
